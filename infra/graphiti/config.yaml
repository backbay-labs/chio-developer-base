# Graphiti MCP config for chio-developer-base.
#
# Group ID isolates this project's episodes from any other Graphiti
# instance sharing the same Neo4j. Telemetry off by default per the
# kb-upgrade-decision episode (curated seeds only; nothing user-content
# leaves the local stack without explicit opt-in).

group_id: chio-repo

telemetry:
  enabled: false

