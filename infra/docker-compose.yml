name: chio-kb

# Phase 1.1 stack. Four services that the chio-kb MCP gateway depends on.
# Brought up via `make kb-up` from the repo root.
#
# Per ADR-0003, this lives at infra/ (Obsidian vault root is the repo root,
# not vault/, so paths like ../vault are correctly relative for the
# chio-kb-mcp's vault mount).
#
# Per AGENTS.md hard rules, the four services are isolated to their own
# named volumes; nothing here imports chio_*. The chio-pack adapter that
# uses these services lives in chio-pack/ and is loaded into the gateway
# container at build time via the Dockerfile.

services:

  kb-postgres:
    image: pgvector/pgvector:pg16
    container_name: chio-kb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chio_kb}
      POSTGRES_USER: ${POSTGRES_USER:-cocoindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocoindex}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - kb-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cocoindex} -d ${POSTGRES_DB:-chio_kb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  kb-neo4j:
    image: neo4j:5.20-community
    container_name: chio-kb-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - kb-neo4j-data:/data
      - kb-neo4j-logs:/logs
      - ./neo4j:/var/lib/neo4j/import/chio:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-demodemo}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  graphiti-mcp:
    image: zepai/graphiti-mcp:latest
    container_name: chio-kb-graphiti
    depends_on:
      kb-neo4j:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEO4J_URI: bolt://kb-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demodemo}
      GROUP_ID: ${GRAPHITI_GROUP_ID:-chio-repo}
      TELEMETRY_ENABLED: ${GRAPHITI_TELEMETRY_ENABLED:-false}
    ports:
      - "${GRAPHITI_PORT:-8000}:8000"
    volumes:
      - ./graphiti/config.yaml:/app/config.yaml:ro

  chio-kb-mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.chio-kb-mcp
    container_name: chio-kb-mcp
    depends_on:
      kb-postgres:
        condition: service_healthy
      kb-neo4j:
        condition: service_healthy
      graphiti-mcp:
        condition: service_started
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-cocoindex}:${POSTGRES_PASSWORD:-cocoindex}@kb-postgres:5432/${POSTGRES_DB:-chio_kb}
      NEO4J_URI: bolt://kb-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demodemo}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-chio-repo}
      GRAPHITI_MCP_URL: http://graphiti-mcp:8000/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHIO_KB_LLM_MODEL: ${CHIO_KB_LLM_MODEL:-openai/gpt-4o-mini}
      CHIO_KB_EMBED_MODEL: ${CHIO_KB_EMBED_MODEL:-text-embedding-3-small}
      CHIO_KB_REPO_ROOT: /workspace
      CHIO_KB_MCP_HOST: 0.0.0.0
      CHIO_KB_MCP_PORT: 8111
    ports:
      - "${CHIO_KB_MCP_PORT:-8111}:8111"
    volumes:
      # Source repo (arc) mounted read-only — the indexer reads, never writes.
      - ${ARC_REPO:-../../arc}:/workspace:ro
      # Vault mounted read-only — the daemon reads frontmatter, derives episodes.
      - ../vault:/vault:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8111/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  kb-postgres-data:
  kb-neo4j-data:
  kb-neo4j-logs:
