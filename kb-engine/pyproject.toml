[project]
name = "kb-engine"
version = "0.2.0"
description = "Generic retrieval / graph / MCP framework for chio-developer-base. Domain-agnostic."
requires-python = ">=3.11"
authors = [{ name = "Backbay" }]
dependencies = [
    # Ed25519 receipt signing is core. Backing-store drivers below remain
    # optional extras so offline dev does not need Postgres/Neo4j/OpenAI SDKs.
    "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
neo4j = ["neo4j>=5"]
openai = ["openai>=1.0"]
watch = ["watchdog>=4"]
yaml = ["pyyaml>=6.0"]
http = ["httpx>=0.27"]
# Optional Wave 4 dual-index sidecar. Not required for CI; pgvector remains primary.
turbovec = ["turbovec>=0.8.0", "numpy>=1.26"]
all = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "neo4j>=5",
    "openai>=1.0",
    "watchdog>=4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "turbovec>=0.8.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_engine"]
