name: eval

# Phase 0 / Phase 1.2 partial-flip per issue #5.
#
# BLOCKING gates (continue-on-error: false / unset — fail the build):
#   - Engine ↔ pack boundary (ops/ci/check-imports.py)
#   - kb-engine unit tests (plugin protocols, registry dispatch)
#   - chio-pack unit tests (boundary AST check, fixture schema, plugin
#     registration, heuristic classifier, session log)
#
# INFORMATIONAL gates (continue-on-error: true — comment, don't fail):
#   - make kb-eval-outcomes (returns blocked-input until ADR-0002
#     baselines exist; flip continue-on-error: false here when baselines
#     land — that's the final close-out of issue #5).
#
# The retrieval eval (PR #599's 9-category A floor) lives in a separate
# workflow at .github/workflows/retrieval-a-gate.yml (added M0-D.4) so
# the docker-stack-up job and this fast-feedback unit-test job don't
# share a runner. The retrieval gate uses `make kb-eval-retrieval
# --fail-below-a` against the live stack; this job stays fast and
# secret-free.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  outcomes:
    name: Outcome evals + boundary + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock files are gitignored per PR #599 convention; key the cache
          # off pyproject.toml instead.
          cache-dependency-glob: |
            **/pyproject.toml

      # === BLOCKING gates ===

      - name: Engine ↔ pack boundary check
        # Hard rule #3 (AGENTS.md): kb-engine cannot import chio_*.
        run: python3 ops/ci/check-imports.py

      - name: Orphaned crate-path check (ADR-0002a)
        # Fail closed on crates/chio-receipts/ — actual home is
        # crates/core/chio-core-types (+ chio-eval-receipt).
        run: python3 ops/ci/check-orphaned-crate-paths.py

      - name: kb-engine unit tests
        # Plugin protocol contracts, registry dispatch, dataclass behavior.
        run: |
          cd kb-engine
          uv sync --group dev
          uv run python -m pytest tests/ -v

      - name: chio-pack unit tests
        # Fixture schema validation (test_runners), AST-level boundary
        # check (test_plugin), plugin registration end-to-end,
        # heuristic mistake classifier, session log writer.
        run: |
          cd chio-pack
          uv sync --group dev
          uv run python -m pytest tests/ -v

      - name: Synthetic second-pack smoke
        # Wave 2: generate demo-pack, install it, and prove the generic
        # Registry entry-point path can load more than chio-pack.
        run: make smoke-second-pack

      # === INFORMATIONAL gates ===

      - name: Run outcome evals (Phase 0 — non-blocking)
        id: eval
        # Runners return blocked-input until ADR-0002 baselines exist
        # (Phase 1.x agent-runner spawning, KB-stack-running kb_search,
        # rater-pool sign-off). Flip continue-on-error: false when the
        # report shows status: ok across all four evals.
        continue-on-error: true
        run: make kb-eval-outcomes

      - name: Post outcomes report as PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'vault/_meta/dashboards/eval-outcomes.md';
            if (!fs.existsSync(path)) {
              core.warning(`No outcomes report at ${path}`);
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- chio-eval-outcomes -->';
            const tagged = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: tagged,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: tagged,
              });
            }

  fresh-clone-smoke:
    # M0-D.5 — catch path-dependent breakage before claiming
    # "fresh-clone-to-working ≤ 10 min" (PLAN.md Phase 1.5 acceptance
    # criterion). Verifies the repo can be cloned to an arbitrary
    # absolute path and the unit tests + status target still work
    # without any assumptions about the original checkout location.
    name: Fresh-clone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full git history because the smoke test re-clones
          # via `git clone .` — a shallow checkout would refuse to
          # clone with the default protocol.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml

      - name: Clone the workspace into /tmp/clone
        # `git clone .` validates that the repo's tracked content is
        # actually committed (no untracked-only fixtures, no relative
        # paths that escape the repo root). The clone target is an
        # absolute path far from the original to surface any
        # ${{ github.workspace }}-baked assumptions.
        run: git clone "$(pwd)" /tmp/clone

      - name: kb-status from the clone
        # `make kb-status` is a Phase-0 self-report. Running it from
        # the clone proves the Makefile and ops/scripts work without
        # the original checkout dir.
        working-directory: /tmp/clone
        run: make kb-status

      - name: Unit tests from the clone
        # The two unit-test suites that gate every PR. Running them
        # from /tmp/clone catches anything that hard-codes the
        # original repo path (e.g., importable test fixtures, test-
        # discovery rooted at $CWD/..).
        working-directory: /tmp/clone
        run: |
          cd kb-engine && uv sync --group dev && uv run python -m pytest tests/ -q
          cd ../chio-pack && uv sync --group dev && uv run python -m pytest tests/ -q

      - name: Engine ↔ pack boundary check from the clone
        # The boundary script computes the repo root from its own
        # __file__. Running from /tmp/clone confirms the relative-
        # path math is location-independent.
        working-directory: /tmp/clone
        run: python3 ops/ci/check-imports.py
